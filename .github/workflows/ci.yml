name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The cross-link graph IS the value of this repository, so a broken relative
  # link is a real defect, not a cosmetic one. Same for a scene that no longer
  # matches its committed diagram.
  docs:
    name: Docs · links, scenes, diagrams
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Every relative markdown link resolves
        run: python scripts/check_links.py

      - name: Every scene validates against the schema
        run: python scripts/check_scenes.py

      # A broken Mermaid block does not fail loudly -- GitHub renders it as a
      # grey error box that only someone scrolling to that exact spot ever sees.
      - name: Every Mermaid diagram parses
        run: python scripts/check_mermaid.py

      - name: No committed diagram is stale versus its scene
        run: python scripts/render_diagrams.py --check

      # The matrix and catalogue are generated from data. A hand-edit to the
      # markdown would be silently reverted on the next regeneration, so the
      # build refuses to let the two drift apart.
      - name: Combination matrix matches its generator
        run: python scripts/gen_combination_matrix.py --check

      - name: Pattern catalogue matches its generator
        run: python scripts/gen_pattern_catalogue.py --check

      - name: Interview bank matches its generator
        run: python scripts/gen_interview.py --check

      - name: Reading-path footers are current
        run: python scripts/gen_path.py --check

      # The design exercises render the same JSON the studio imports, so the
      # page and the app cannot give different answers to the same question.
      - name: Design exercises match their generator
        run: python scripts/gen_decisions.py --check

      # Every figure in a case study is traceable to a named primary source.
      # The generator also refuses a decision with no cost and a doesNotApply
      # that has decayed into a disclaimer -- the two fields the section is for.
      - name: Case studies match their generator
        run: python scripts/gen_case_studies.py --check

  visualizer:
    name: Visualizer · lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: visualizer/package-lock.json

      - name: Install
        working-directory: visualizer
        run: npm ci

      - name: Lint
        working-directory: visualizer
        run: npm run lint

      # A wrong answer key confidently corrects the reader with something false.
      # Lint cannot see that, so the quiz is checked against the scene directly.
      - name: Quiz answer keys match the scene
        working-directory: visualizer
        run: npm run check:quiz

      # The studio tells a reader their architecture was wrong. If the reference
      # answer is itself wrong it does that confidently, and no linter can see it.
      - name: Design-studio briefs grade correctly
        working-directory: visualizer
        run: npm run check:studio

      # Parameter decisions are attached to versions, but briefs cover the
      # transitions between them -- so a decision can be authored, pass shape
      # validation, and still be reachable by nobody. Three of the first
      # twenty-four were. This walks the real UI path to prove they are shown.
      - name: Parameter decisions are reachable and grade correctly
        working-directory: visualizer
        run: npm run check:decisions

      - name: Build
        working-directory: visualizer
        run: npm run build

  implementations:
    name: Implementations · pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      # Implementations are stdlib-only on purpose: a reader should be able to
      # run any of them with nothing installed but Python and pytest.
      - name: Test
        run: pytest 18-implementations -q

  ci:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [docs, visualizer, implementations]
    steps:
      - run: echo "All CI jobs passed."
