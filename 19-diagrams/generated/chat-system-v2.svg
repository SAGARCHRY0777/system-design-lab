<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1312 202" width="1312" height="202" role="img" aria-label="Chat System version 2: 10K online · WebSocket">
<style><![CDATA[
/* Light is the base, dark is the override -- same three-state structure as the
   app. A committed SVG is viewed on GitHub in whichever theme the reader uses,
   and a hardcoded dark diagram on a light page reads as broken. Media queries
   inside an SVG do apply when it is referenced as an image. */
.bg{fill:#f4f6f4}
.shape{fill:#eaeeec;stroke:#b8c4bf;stroke-width:1.6}
.shape.cache{stroke-dasharray:7 5}
.shape.bottleneck{stroke:#8a5a0c;stroke-width:2.2}
.lbl{fill:#16201e;font:500 12.5px system-ui,sans-serif}
.note{fill:#6d7c77;font:10px system-ui,sans-serif}
.edge{fill:none;stroke:#b8c4bf;stroke-width:1.6}
.edge.async{stroke-dasharray:6 5}
.edge.replication{stroke-dasharray:2 4;stroke-width:2.6;opacity:.8}
.elbl{fill:#6d7c77;font:10px system-ui,sans-serif}
.elbl-bg{fill:#f4f6f4}
.head{fill:#b8c4bf}
.title{fill:#16201e;font:600 14px system-ui,sans-serif}
.sub{fill:#4a5854;font:12px system-ui,sans-serif}
.tag{fill:#1c6853;font:600 11px ui-monospace,monospace}
.halo{fill:#1c6853;opacity:.2}
.core{fill:#1c6853}

@media (prefers-color-scheme: dark){
  .bg{fill:#0e1414}
  .shape{fill:#111818;stroke:#344544}
  .shape.bottleneck{stroke:#d9a441}
  .lbl{fill:#e4ecea}
  .note{fill:#6f817d}
  .edge{stroke:#344544}
  .elbl{fill:#6f817d}
  .elbl-bg{fill:#0e1414}
  .head{fill:#344544}
  .title{fill:#e4ecea}
  .sub{fill:#9fb0ac}
  .tag{fill:#4fc3a1}
  .halo{fill:#4fc3a1}
  .core{fill:#4fc3a1}
}
]]></style>
<rect class="bg" width="1312" height="202"/>
<text class="tag" x="40" y="26">V2</text>
<text class="title" x="70" y="26">Chat System</text>
<text class="sub" x="40" y="46">10K online · WebSocket · p50 12ms · p99 60ms</text>
<g transform="translate(0 62)">
<path class="edge sync" d="M172.0,70.0 C239.0,70.0 239.0,70.0 306.0,70.0"/>
<rect class="elbl-bg" x="209.8" y="53.0" width="67.4" height="12" rx="2"/><text class="elbl" x="243.5" y="61.0" text-anchor="middle">WSS upgrade</text>
<path class="edge sync" d="M447.0,70.0 C514.0,70.0 514.0,70.0 581.0,70.0"/>
<rect class="elbl-bg" x="457.8" y="53.0" width="121.4" height="12" rx="2"/><text class="elbl" x="518.5" y="61.0" text-anchor="middle">one socket, held open</text>
<path class="edge sync" d="M722.0,70.0 C789.0,70.0 789.0,70.0 856.0,70.0"/>
<rect class="elbl-bg" x="778.7" y="53.0" width="29.6" height="12" rx="2"/><text class="elbl" x="793.5" y="61.0" text-anchor="middle">send</text>
<path class="edge sync" d="M997.0,70.0 C1064.0,70.0 1064.0,70.0 1131.0,70.0"/>
<rect class="elbl-bg" x="1048.3" y="53.0" width="40.4" height="12" rx="2"/><text class="elbl" x="1068.5" y="61.0" text-anchor="middle">append</text>
<rect class="shape client" x="40" y="40.0" width="132" height="60" rx="26"/>
<text class="lbl" x="106.0" y="67.0" text-anchor="middle">Clients</text>
<text class="note" x="106.0" y="84.0" text-anchor="middle">phone, web, desktop</text>
<polygon class="shape lb" points="333,40.0 429,40.0 447,70.0 429,100.0 333,100.0 315,70.0"/>
<text class="lbl" x="381.0" y="67.0" text-anchor="middle">Load Balancer</text>
<text class="note" x="381.0" y="84.0" text-anchor="middle">sticky, long-lived</text>
<rect class="shape service" x="590" y="40.0" width="132" height="60" rx="6"/>
<text class="lbl" x="656.0" y="67.0" text-anchor="middle">WS Gateways</text>
<text class="note" x="656.0" y="84.0" text-anchor="middle">~25K sockets each</text>
<rect class="shape service" x="865" y="40.0" width="132" height="60" rx="6"/>
<text class="lbl" x="931.0" y="67.0" text-anchor="middle">Chat Service</text>
<text class="note" x="931.0" y="84.0" text-anchor="middle">stateless</text>
<path class="shape store" d="M1140,49.0 a66.0,9 0 0 1 132,0 v42 a66.0,9 0 0 1 -132,0 z"/><path class="shape store" fill="none" d="M1140,49.0 a66.0,9 0 0 0 132,0"/>
<text class="lbl" x="1206.0" y="67.0" text-anchor="middle">Message Store</text>
<text class="note" x="1206.0" y="84.0" text-anchor="middle">partitioned by conversation</text>
<g><circle class="halo" r="11"/><circle class="core" r="5.5"/><animateMotion dur="8.46s" repeatCount="indefinite" path="M106.0,70.0 L381.0,70.0 L656.0,70.0 L931.0,70.0 L1206.0,70.0 L931.0,70.0 L656.0,70.0 L106.0,70.0"/></g>
</g></svg>
