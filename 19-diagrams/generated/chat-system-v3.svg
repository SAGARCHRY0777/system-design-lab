<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 382" width="1376" height="382" role="img" aria-label="Chat System version 3: 200K online · two gateways">
<style><![CDATA[
/* Light is the base, dark is the override -- same three-state structure as the
   app. A committed SVG is viewed on GitHub in whichever theme the reader uses,
   and a hardcoded dark diagram on a light page reads as broken. Media queries
   inside an SVG do apply when it is referenced as an image. */
.bg{fill:#f4f6f4}
.shape{fill:#eaeeec;stroke:#b8c4bf;stroke-width:1.6}
.shape.cache{stroke-dasharray:7 5}
.shape.bottleneck{stroke:#8a5a0c;stroke-width:2.2}
.lbl{fill:#16201e;font:500 12.5px system-ui,sans-serif}
.note{fill:#6d7c77;font:10px system-ui,sans-serif}
.edge{fill:none;stroke:#b8c4bf;stroke-width:1.6}
.edge.async{stroke-dasharray:6 5}
.edge.replication{stroke-dasharray:2 4;stroke-width:2.6;opacity:.8}
.elbl{fill:#6d7c77;font:10px system-ui,sans-serif}
.elbl-bg{fill:#f4f6f4}
.head{fill:#b8c4bf}
.title{fill:#16201e;font:600 14px system-ui,sans-serif}
.sub{fill:#4a5854;font:12px system-ui,sans-serif}
.tag{fill:#1c6853;font:600 11px ui-monospace,monospace}
.halo{fill:#1c6853;opacity:.2}
.core{fill:#1c6853}

@media (prefers-color-scheme: dark){
  .bg{fill:#0e1414}
  .shape{fill:#111818;stroke:#344544}
  .shape.bottleneck{stroke:#d9a441}
  .lbl{fill:#e4ecea}
  .note{fill:#6f817d}
  .edge{stroke:#344544}
  .elbl{fill:#6f817d}
  .elbl-bg{fill:#0e1414}
  .head{fill:#344544}
  .title{fill:#e4ecea}
  .sub{fill:#9fb0ac}
  .tag{fill:#4fc3a1}
  .halo{fill:#4fc3a1}
  .core{fill:#4fc3a1}
}
]]></style>
<rect class="bg" width="1376" height="382"/>
<text class="tag" x="40" y="26">V3</text>
<text class="title" x="70" y="26">Chat System</text>
<text class="sub" x="40" y="46">200K online · two gateways · p50 14ms · p99 70ms</text>
<g transform="translate(0 62)">
<path class="edge sync" d="M172.0,160.0 C247.0,160.0 247.0,160.0 322.0,160.0"/>
<rect class="elbl-bg" x="239.4" y="143.0" width="24.2" height="12" rx="2"/><text class="elbl" x="251.5" y="151.0" text-anchor="middle">WSS</text>
<path class="edge sync" d="M463.0,160.0 C538.0,160.0 538.0,160.0 613.0,160.0"/>
<path class="edge sync" d="M754.0,160.0 C974.5,160.0 974.5,70.0 1195.0,70.0"/>
<rect class="elbl-bg" x="921.0" y="98.0" width="116.0" height="12" rx="2"/><text class="elbl" x="979.0" y="106.0" text-anchor="middle">register this socket</text>
<path class="edge sync" d="M754.0,160.0 C829.0,160.0 829.0,160.0 904.0,160.0"/>
<rect class="elbl-bg" x="818.7" y="143.0" width="29.6" height="12" rx="2"/><text class="elbl" x="833.5" y="151.0" text-anchor="middle">send</text>
<path class="edge sync" d="M1045.0,160.0 C1120.0,160.0 1120.0,250.0 1195.0,250.0"/>
<rect class="elbl-bg" x="1104.3" y="188.0" width="40.4" height="12" rx="2"/><text class="elbl" x="1124.5" y="196.0" text-anchor="middle">append</text>
<path class="edge sync" d="M1045.0,160.0 C1120.0,160.0 1120.0,70.0 1195.0,70.0"/>
<rect class="elbl-bg" x="1055.7" y="98.0" width="137.6" height="12" rx="2"/><text class="elbl" x="1124.5" y="106.0" text-anchor="middle">which gateway holds Bob?</text>
<path class="edge async" d="M1045.0,160.0 C1120.0,160.0 1120.0,160.0 1195.0,160.0"/>
<rect class="elbl-bg" x="1058.4" y="143.0" width="132.2" height="12" rx="2"/><text class="elbl" x="1124.5" y="151.0" text-anchor="middle">publish to that gateway</text>
<rect class="shape client" x="40" y="130.0" width="132" height="60" rx="26"/>
<text class="lbl" x="106.0" y="157.0" text-anchor="middle">Clients</text>
<text class="note" x="106.0" y="174.0" text-anchor="middle">phone, web, desktop</text>
<polygon class="shape lb" points="349,130.0 445,130.0 463,160.0 445,190.0 349,190.0 331,160.0"/>
<text class="lbl" x="397.0" y="157.0" text-anchor="middle">Load Balancer</text>
<text class="note" x="397.0" y="174.0" text-anchor="middle">sticky, long-lived</text>
<rect class="shape service" x="622" y="130.0" width="132" height="60" rx="6"/>
<text class="lbl" x="688.0" y="157.0" text-anchor="middle">WS Gateways</text>
<text class="note" x="688.0" y="174.0" text-anchor="middle">~25K sockets each</text>
<rect class="shape service" x="913" y="130.0" width="132" height="60" rx="6"/>
<text class="lbl" x="979.0" y="157.0" text-anchor="middle">Chat Service</text>
<text class="note" x="979.0" y="174.0" text-anchor="middle">stateless</text>
<rect class="shape cache" x="1204" y="40.0" width="132" height="60" rx="6"/>
<text class="lbl" x="1270.0" y="67.0" text-anchor="middle">Connection Registry</text>
<text class="note" x="1270.0" y="84.0" text-anchor="middle">user to gateway, TTL 60s</text>
<rect class="shape queue" x="1204" y="130.0" width="132" height="60" rx="4"/><line class="shape queue" x1="1248.0" y1="138.0" x2="1248.0" y2="182.0" opacity="0.35"/><line class="shape queue" x1="1292.0" y1="138.0" x2="1292.0" y2="182.0" opacity="0.35"/>
<text class="lbl" x="1270.0" y="157.0" text-anchor="middle">Routing Bus</text>
<text class="note" x="1270.0" y="174.0" text-anchor="middle">one channel per gateway</text>
<path class="shape store" d="M1204,229.0 a66.0,9 0 0 1 132,0 v42 a66.0,9 0 0 1 -132,0 z"/><path class="shape store" fill="none" d="M1204,229.0 a66.0,9 0 0 0 132,0"/>
<text class="lbl" x="1270.0" y="247.0" text-anchor="middle">Message Store</text>
<text class="note" x="1270.0" y="264.0" text-anchor="middle">partitioned by conversation</text>
<g><circle class="halo" r="11"/><circle class="core" r="5.5"/><animateMotion dur="11.30s" repeatCount="indefinite" path="M106.0,160.0 L397.0,160.0 L688.0,160.0 L979.0,160.0 L1270.0,70.0 L979.0,160.0 L1270.0,160.0 L688.0,160.0 L106.0,160.0"/></g>
</g></svg>
