<rect class="elbl-bg" x="1760.8" y="188.0" width="67.4" height="12" rx="2"/><text class="elbl" x="1794.5" y="196.0" text-anchor="middle">member list</text>
<path class="edge sync" d="M1707.0,160.0 C1790.0,160.0 1790.0,70.0 1873.0,70.0"/>
<rect class="elbl-bg" x="1717.6" y="98.0" width="153.8" height="12" rx="2"/><text class="elbl" x="1794.5" y="106.0" text-anchor="middle">who is connected, and where</text>
