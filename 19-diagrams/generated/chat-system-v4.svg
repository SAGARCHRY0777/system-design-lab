<text class="lbl" x="1641.0" y="165.0" text-anchor="middle">Fan-out Workers</text>
<path class="shape store" d="M1882,229.0 a66.0,9 0 0 1 132,0 v42 a66.0,9 0 0 1 -132,0 z"/><path class="shape store" fill="none" d="M1882,229.0 a66.0,9 0 0 0 132,0"/>
<text class="lbl" x="1948.0" y="247.0" text-anchor="middle">Membership</text>
