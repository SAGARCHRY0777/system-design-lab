<rect class="shape client" x="40" y="130.0" width="132" height="60" rx="26"/>
<text class="lbl" x="106.0" y="157.0" text-anchor="middle">Clients</text>
<text class="note" x="106.0" y="174.0" text-anchor="middle">phone, web, desktop</text>
<polygon class="shape lb" points="365,130.0 461,130.0 479,160.0 461,190.0 365,190.0 347,160.0"/>
<text class="lbl" x="413.0" y="157.0" text-anchor="middle">Load Balancer</text>
<text class="note" x="413.0" y="174.0" text-anchor="middle">sticky, long-lived</text>
<rect class="shape service" x="654" y="130.0" width="132" height="60" rx="6"/>
<text class="lbl" x="720.0" y="157.0" text-anchor="middle">WS Gateways</text>
<text class="note" x="720.0" y="174.0" text-anchor="middle">~25K sockets each</text>
