<path class="shape store" d="M1268,184.0 a66.0,9 0 0 1 132,0 v42 a66.0,9 0 0 1 -132,0 z"/><path class="shape store" fill="none" d="M1268,184.0 a66.0,9 0 0 0 132,0"/>
<text class="lbl" x="1334.0" y="202.0" text-anchor="middle">Message Store</text>
<text class="note" x="1334.0" y="219.0" text-anchor="middle">partitioned by conversation</text>
<g><circle class="halo" r="11"/><circle class="core" r="5.5"/><animateMotion dur="16.75s" repeatCount="indefinite" path="M106.0,160.0 L413.0,160.0 L720.0,160.0 L1027.0,160.0 L1334.0,115.0 L1641.0,160.0 L1948.0,250.0 L1641.0,160.0 L1948.0,70.0 L1641.0,160.0 L1948.0,160.0 L720.0,160.0"/></g>
</g></svg>
