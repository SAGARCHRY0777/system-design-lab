<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1248 202" width="1248" height="202" role="img" aria-label="Notification System version 2: 3M users · accept and return">
<style><![CDATA[
/* Light is the base, dark is the override -- same three-state structure as the
   app. A committed SVG is viewed on GitHub in whichever theme the reader uses,
   and a hardcoded dark diagram on a light page reads as broken. Media queries
   inside an SVG do apply when it is referenced as an image. */
.bg{fill:#f4f6f4}
.shape{fill:#eaeeec;stroke:#b8c4bf;stroke-width:1.6}
.shape.cache{stroke-dasharray:7 5}
.shape.bottleneck{stroke:#8a5a0c;stroke-width:2.2}
.lbl{fill:#16201e;font:500 12.5px system-ui,sans-serif}
.note{fill:#6d7c77;font:10px system-ui,sans-serif}
.edge{fill:none;stroke:#b8c4bf;stroke-width:1.6}
.edge.async{stroke-dasharray:6 5}
.edge.replication{stroke-dasharray:2 4;stroke-width:2.6;opacity:.8}
.elbl{fill:#6d7c77;font:10px system-ui,sans-serif}
.elbl-bg{fill:#f4f6f4}
.head{fill:#b8c4bf}
.title{fill:#16201e;font:600 14px system-ui,sans-serif}
.sub{fill:#4a5854;font:12px system-ui,sans-serif}
.tag{fill:#1c6853;font:600 11px ui-monospace,monospace}
.halo{fill:#1c6853;opacity:.2}
.core{fill:#1c6853}

@media (prefers-color-scheme: dark){
  .bg{fill:#0e1414}
  .shape{fill:#111818;stroke:#344544}
  .shape.bottleneck{stroke:#d9a441}
  .lbl{fill:#e4ecea}
  .note{fill:#6f817d}
  .edge{stroke:#344544}
  .elbl{fill:#6f817d}
  .elbl-bg{fill:#0e1414}
  .head{fill:#344544}
  .title{fill:#e4ecea}
  .sub{fill:#9fb0ac}
  .tag{fill:#4fc3a1}
  .halo{fill:#4fc3a1}
  .core{fill:#4fc3a1}
}
]]></style>
<rect class="bg" width="1248" height="202"/>
<text class="tag" x="40" y="26">V2</text>
<text class="title" x="70" y="26">Notification System</text>
<text class="sub" x="40" y="46">3M users · accept and return · p50 9ms · p99 35ms</text>
<g transform="translate(0 62)">
<path class="edge sync" d="M172.0,70.0 C231.0,70.0 231.0,70.0 290.0,70.0"/>
<rect class="elbl-bg" x="209.9" y="53.0" width="51.2" height="12" rx="2"/><text class="elbl" x="235.5" y="61.0" text-anchor="middle">notify()</text>
<path class="edge async" d="M431.0,70.0 C490.0,70.0 490.0,70.0 549.0,70.0"/>
<rect class="elbl-bg" x="441.9" y="53.0" width="105.2" height="12" rx="2"/><text class="elbl" x="494.5" y="61.0" text-anchor="middle">accept, return 202</text>
<path class="edge async" d="M690.0,70.0 C749.0,70.0 749.0,70.0 808.0,70.0"/>
<path class="edge sync" d="M949.0,70.0 C1008.0,70.0 1008.0,70.0 1067.0,70.0"/>
<rect class="elbl-bg" x="997.7" y="53.0" width="29.6" height="12" rx="2"/><text class="elbl" x="1012.5" y="61.0" text-anchor="middle">SMTP</text>
<rect class="shape client" x="40" y="40.0" width="132" height="60" rx="26"/>
<text class="lbl" x="106.0" y="67.0" text-anchor="middle">Producer Services</text>
<text class="note" x="106.0" y="84.0" text-anchor="middle">order shipped, comment reply</text>
<rect class="shape service" x="299" y="40.0" width="132" height="60" rx="6"/>
<text class="lbl" x="365.0" y="67.0" text-anchor="middle">Notification API</text>
<text class="note" x="365.0" y="84.0" text-anchor="middle">accepts and returns</text>
<rect class="shape queue" x="558" y="40.0" width="132" height="60" rx="4"/><line class="shape queue" x1="602.0" y1="48.0" x2="602.0" y2="92.0" opacity="0.35"/><line class="shape queue" x1="646.0" y1="48.0" x2="646.0" y2="92.0" opacity="0.35"/>
<text class="lbl" x="624.0" y="75.0" text-anchor="middle">Notification Queue</text>
<rect class="shape service" x="817" y="40.0" width="132" height="60" rx="6"/>
<text class="lbl" x="883.0" y="75.0" text-anchor="middle">Email Workers</text>
<rect class="shape external" x="1076" y="40.0" width="132" height="60" rx="6"/>
<text class="lbl" x="1142.0" y="67.0" text-anchor="middle">Email Provider</text>
<text class="note" x="1142.0" y="84.0" text-anchor="middle">2,000/s on our plan</text>
<g><circle class="halo" r="11"/><circle class="core" r="5.5"/><animateMotion dur="3.98s" repeatCount="indefinite" path="M106.0,70.0 L365.0,70.0 L624.0,70.0 L883.0,70.0 L1142.0,70.0"/></g>
</g></svg>
