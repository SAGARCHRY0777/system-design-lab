<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1166 382" width="1166" height="382" role="img" aria-label="Payment System version 2: 1M/day · idempotency keys">
<style><![CDATA[
/* Light is the base, dark is the override -- same three-state structure as the
   app. A committed SVG is viewed on GitHub in whichever theme the reader uses,
   and a hardcoded dark diagram on a light page reads as broken. Media queries
   inside an SVG do apply when it is referenced as an image. */
.bg{fill:#f4f6f4}
.shape{fill:#eaeeec;stroke:#b8c4bf;stroke-width:1.6}
.shape.cache{stroke-dasharray:7 5}
.shape.bottleneck{stroke:#8a5a0c;stroke-width:2.2}
.lbl{fill:#16201e;font:500 12.5px system-ui,sans-serif}
.note{fill:#6d7c77;font:10px system-ui,sans-serif}
.edge{fill:none;stroke:#b8c4bf;stroke-width:1.6}
.edge.async{stroke-dasharray:6 5}
.edge.replication{stroke-dasharray:2 4;stroke-width:2.6;opacity:.8}
.elbl{fill:#6d7c77;font:10px system-ui,sans-serif}
.elbl-bg{fill:#f4f6f4}
.head{fill:#b8c4bf}
.title{fill:#16201e;font:600 14px system-ui,sans-serif}
.sub{fill:#4a5854;font:12px system-ui,sans-serif}
.tag{fill:#1c6853;font:600 11px ui-monospace,monospace}
.halo{fill:#1c6853;opacity:.2}
.core{fill:#1c6853}

@media (prefers-color-scheme: dark){
  .bg{fill:#0e1414}
  .shape{fill:#111818;stroke:#344544}
  .shape.bottleneck{stroke:#d9a441}
  .lbl{fill:#e4ecea}
  .note{fill:#6f817d}
  .edge{stroke:#344544}
  .elbl{fill:#6f817d}
  .elbl-bg{fill:#0e1414}
  .head{fill:#344544}
  .title{fill:#e4ecea}
  .sub{fill:#9fb0ac}
  .tag{fill:#4fc3a1}
  .halo{fill:#4fc3a1}
  .core{fill:#4fc3a1}
}
]]></style>
<rect class="bg" width="1166" height="382"/>
<text class="tag" x="40" y="26">V2</text>
<text class="title" x="70" y="26">Payment System</text>
<text class="sub" x="40" y="46">1M/day · idempotency keys · p50 930ms · p99 3100ms</text>
<g transform="translate(0 62)">
<path class="edge sync" d="M172.0,160.0 C260.5,160.0 260.5,160.0 349.0,160.0"/>
<rect class="elbl-bg" x="247.5" y="143.0" width="35.0" height="12" rx="2"/><text class="elbl" x="265.0" y="151.0" text-anchor="middle">HTTPS</text>
<path class="edge sync" d="M490.0,160.0 C578.5,160.0 578.5,160.0 667.0,160.0"/>
<path class="edge sync" d="M808.0,160.0 C896.5,160.0 896.5,70.0 985.0,70.0"/>
<rect class="elbl-bg" x="818.7" y="98.0" width="164.6" height="12" rx="2"/><text class="elbl" x="901.0" y="106.0" text-anchor="middle">claim key, or replay response</text>
<path class="edge sync" d="M808.0,160.0 C896.5,160.0 896.5,250.0 985.0,250.0"/>
<rect class="elbl-bg" x="853.8" y="188.0" width="94.4" height="12" rx="2"/><text class="elbl" x="901.0" y="196.0" text-anchor="middle">charge, same key</text>
<path class="edge sync" d="M808.0,160.0 C896.5,160.0 896.5,160.0 985.0,160.0"/>
<rect class="shape client" x="40" y="130.0" width="132" height="60" rx="26"/>
<text class="lbl" x="106.0" y="165.0" text-anchor="middle">Checkout</text>
<polygon class="shape lb" points="376,130.0 472,130.0 490,160.0 472,190.0 376,190.0 358,160.0"/>
<text class="lbl" x="424.0" y="165.0" text-anchor="middle">Load Balancer</text>
<rect class="shape service" x="676" y="130.0" width="132" height="60" rx="6"/>
<text class="lbl" x="742.0" y="165.0" text-anchor="middle">Payment API</text>
<path class="shape store" d="M994,49.0 a66.0,9 0 0 1 132,0 v42 a66.0,9 0 0 1 -132,0 z"/><path class="shape store" fill="none" d="M994,49.0 a66.0,9 0 0 0 132,0"/>
<text class="lbl" x="1060.0" y="67.0" text-anchor="middle">Idempotency Store</text>
<text class="note" x="1060.0" y="84.0" text-anchor="middle">key to stored response</text>
<path class="shape store" d="M994,139.0 a66.0,9 0 0 1 132,0 v42 a66.0,9 0 0 1 -132,0 z"/><path class="shape store" fill="none" d="M994,139.0 a66.0,9 0 0 0 132,0"/>
<text class="lbl" x="1060.0" y="157.0" text-anchor="middle">Payment Records</text>
<text class="note" x="1060.0" y="174.0" text-anchor="middle">state machine per payment</text>
<rect class="shape external bottleneck" x="994" y="220.0" width="132" height="60" rx="6"/>
<text class="lbl" x="1060.0" y="247.0" text-anchor="middle">Payment Provider</text>
<text class="note" x="1060.0" y="264.0" text-anchor="middle">cannot be made transactional</text>
<g><circle class="halo" r="11"/><circle class="core" r="5.5"/><animateMotion dur="7.43s" repeatCount="indefinite" path="M106.0,160.0 L424.0,160.0 L742.0,160.0 L1060.0,70.0 L742.0,160.0 L106.0,160.0"/></g>
</g></svg>
