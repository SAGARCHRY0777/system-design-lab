<path class="edge sync" d="M624.0,160.0 C666.5,160.0 666.5,160.0 709.0,160.0"/>
<rect class="elbl-bg" x="650.8" y="143.0" width="40.4" height="12" rx="2"/><text class="elbl" x="671.0" y="151.0" text-anchor="middle">writes</text>
<path class="edge replication" d="M842.0,160.0 C838.0,160.0 838.0,250.0 842.0,250.0"/>
