<text class="lbl" x="784.0" y="255.0" text-anchor="middle">Read Replicas</text>
<g><circle class="halo" r="11"/><circle class="core" r="5.5"/><animateMotion dur="7.22s" repeatCount="indefinite" path="M106.0,160.0 L332.0,160.0 L558.0,160.0 L784.0,70.0 L558.0,160.0 L784.0,250.0 L558.0,160.0 L106.0,160.0"/></g>
</g></svg>
