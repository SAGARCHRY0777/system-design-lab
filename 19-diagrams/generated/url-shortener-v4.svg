<text class="lbl" x="332.0" y="165.0" text-anchor="middle">Load Balancer</text>
<rect class="shape service" x="492" y="130.0" width="132" height="60" rx="6"/>
<text class="lbl" x="558.0" y="165.0" text-anchor="middle">App Servers</text>
<rect class="shape cache" x="718" y="40.0" width="132" height="60" rx="6"/>
<text class="lbl" x="784.0" y="67.0" text-anchor="middle">Cache</text>
